name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install native XML validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
