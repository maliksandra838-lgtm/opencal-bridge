name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Do not attach real certificates, customer spreadsheets, personal data, credentials, or licensed standards."
  - type: input
    id: version
    attributes:
      label: OpenCal Bridge version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give minimal steps and synthetic rows.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real business, personal, certificate, device, path, and credential data.
          required: true
