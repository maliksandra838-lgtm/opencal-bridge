name: Compatibility report
description: Share a privacy-safe interoperability result from another DCC workflow.
title: "[Compatibility]: "
labels: [compatibility, needs-triage]
body:
  - type: input
    id: tool
    attributes:
      label: Tool or workflow tested
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Compatible, Partially compatible, Not compatible]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic evidence and diagnostic codes
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains synthetic or already-public data only.
          required: true
